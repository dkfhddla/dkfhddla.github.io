<svg xmlns="http://www.w3.org/2000/svg" width="400" height="584" viewBox="0 0 400 584" role="img" aria-labelledby="title desc">
  <title id="title">같은 시간 경계, 다른 화면 위치</title>
  <desc id="desc">시간축에서 Shot A와 Shot B의 재생 구간은 간격 없이 맞닿는다. 화면의 재생 구간은 줌에 따라 길이가 변하지만 헤더·꼬리·여백은 고정 폭이다. 같은 시간 경계가 Shot A의 재생 끝과 Shot B의 재생 시작이라는 두 화면 위치에 대응하므로 경계가 어느 샷에 속하는지도 판단한다. 폭과 배치는 단순화했다.</desc>
  <defs>
    <pattern id="fixed" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#edf0ef"/>
      <path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#c2cec9"/>
    </pattern>
  </defs>
  <rect width="400" height="584" rx="12" fill="#f5f8f7"/>
  <g font-family="system-ui, 'Malgun Gothic', sans-serif" fill="#203d36">
    <text x="24" y="40" font-size="23" font-weight="700">샷의 시간과 화면 좌표</text>
    <text x="24" y="84" font-size="20" font-weight="700">시간축</text>
    <text x="376" y="84" text-anchor="end" font-size="20">간격 없는 재생 구간</text>
    <rect x="24" y="102" width="176" height="50" fill="#d7ece5"/>
    <rect x="200" y="102" width="176" height="50" fill="#dce7f2"/>
    <text x="112" y="134" text-anchor="middle" font-size="22">Shot A</text>
    <text x="288" y="134" text-anchor="middle" font-size="22">Shot B</text>
    <path d="M200 96 V160" stroke="#203d36" stroke-width="3"/>
    <text x="200" y="187" text-anchor="middle" font-size="20">같은 시간 경계</text>
    <path d="M200 197 L134 253 M200 197 L266 253" fill="none" stroke="#526d64" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="24" y="238" font-size="20" font-weight="700">화면축</text>
    <rect x="24" y="260" width="20" height="90" fill="url(#fixed)" stroke="#687e77"/>
    <rect x="44" y="260" width="90" height="90" fill="#d7ece5"/>
    <rect x="134" y="260" width="132" height="90" fill="url(#fixed)" stroke="#687e77"/>
    <rect x="266" y="260" width="90" height="90" fill="#dce7f2"/>
    <rect x="356" y="260" width="20" height="90" fill="url(#fixed)" stroke="#687e77"/>
    <text x="89" y="297" text-anchor="middle" font-size="21">Shot A</text>
    <text x="89" y="327" text-anchor="middle" font-size="20">재생</text>
    <text x="200" y="285" text-anchor="middle" font-size="20">A 꼬리</text>
    <text x="200" y="312" text-anchor="middle" font-size="20">여백</text>
    <text x="200" y="339" text-anchor="middle" font-size="20">B 헤더</text>
    <text x="311" y="297" text-anchor="middle" font-size="21">Shot B</text>
    <text x="311" y="327" text-anchor="middle" font-size="20">재생</text>
    <path d="M134 253 V362 H106 M266 253 V362 H294" fill="none" stroke="#203d36" stroke-width="3"/>
    <text x="104" y="388" text-anchor="middle" font-size="20" font-weight="700">Shot A 재생 끝</text>
    <text x="296" y="388" text-anchor="middle" font-size="20" font-weight="700">Shot B 재생 시작</text>
    <rect x="24" y="416" width="24" height="24" fill="url(#fixed)" stroke="#687e77"/>
    <text x="60" y="435" font-size="20">고정 폭 UI · 재생 시간 없음</text>
    <rect x="24" y="451" width="24" height="24" fill="#d7ece5" stroke="#687e77"/>
    <text x="60" y="470" font-size="20">재생 구간 · 줌에 따라 길이 변화</text>
    <path d="M24 493 H376" stroke="#c2cec9"/>
    <text x="200" y="528" text-anchor="middle" font-size="21" font-weight="700">프레임 × 줌 배율만으로는 부족</text>
    <text x="200" y="557" text-anchor="middle" font-size="20">경계가 어느 샷에 속하는지도 판단</text>
  </g>
</svg>
