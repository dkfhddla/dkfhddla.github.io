<svg xmlns="http://www.w3.org/2000/svg" width="400" height="810" viewBox="0 0 400 810" role="img" aria-labelledby="title desc">
  <title id="title">UI 상태 책임 분리 전후</title>
  <desc id="desc">변경 전에는 화면 표시와 제어가 위젯에 집중되고 Model이 ViewModel을 생성·소유했다. 변경 후에는 View가 위젯 조합과 편집 동작을 담당하고 필요한 ViewModel을 관리하며 Model과 연결한다. Component의 노출 속성에서는 디자인을 조정한다. 실선 화살표는 생성·소유 또는 관리를, 화살촉 없는 점선은 데이터 연결을 나타낸다. 모든 의존성 제거 또는 전체 클래스 구조를 뜻하지 않는다.</desc>
  <defs>
    <marker id="owns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#203d36"/>
    </marker>
  </defs>
  <rect width="400" height="810" rx="12" fill="#f5f8f7"/>
  <g font-family="system-ui, 'Malgun Gothic', sans-serif" fill="#203d36">
    <text x="24" y="40" font-size="23" font-weight="700">UI 상태 책임 분리 전후</text>
    <text x="24" y="82" font-size="21" font-weight="700">변경 전</text>
    <rect x="24" y="100" width="352" height="78" rx="6" fill="#edf0ef" stroke="#687e77"/>
    <text x="200" y="131" text-anchor="middle" font-size="22" font-weight="700">Widget</text>
    <text x="200" y="161" text-anchor="middle" font-size="20">화면 표시 + 제어 책임 집중</text>
    <rect x="24" y="228" width="110" height="54" rx="6" fill="#edf0ef" stroke="#687e77"/>
    <rect x="224" y="228" width="152" height="54" rx="6" fill="#edf0ef" stroke="#687e77"/>
    <text x="79" y="262" text-anchor="middle" font-size="22">Model</text>
    <text x="300" y="262" text-anchor="middle" font-size="22">ViewModel</text>
    <path d="M134 255 H220" stroke="#203d36" stroke-width="2" marker-end="url(#owns)"/>
    <text x="200" y="211" text-anchor="middle" font-size="20">Model이 생성·소유 → ViewModel</text>
    <path d="M24 308 H376" stroke="#c2cec9"/>
    <text x="24" y="344" font-size="21" font-weight="700">변경 후</text>
    <rect x="24" y="364" width="352" height="86" rx="6" fill="#d7ece5" stroke="#687e77"/>
    <text x="200" y="398" text-anchor="middle" font-size="22" font-weight="700">View</text>
    <text x="200" y="428" text-anchor="middle" font-size="20">위젯 조합 · 편집 동작</text>
    <path d="M200 450 V500" stroke="#203d36" stroke-width="2" marker-end="url(#owns)"/>
    <text x="220" y="483" font-size="20">필요한 VM 관리</text>
    <rect x="92" y="506" width="216" height="54" rx="6" fill="#d7ece5" stroke="#687e77"/>
    <text x="200" y="540" text-anchor="middle" font-size="22">ViewModel</text>
    <path d="M200 560 V614" stroke="#526d64" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="220" y="594" font-size="20">데이터 연결</text>
    <rect x="92" y="614" width="216" height="54" rx="6" fill="#dce7f2" stroke="#687e77"/>
    <text x="200" y="648" text-anchor="middle" font-size="22">Model</text>
    <rect x="24" y="696" width="352" height="88" rx="6" fill="#edf0ef" stroke="#687e77"/>
    <text x="200" y="730" text-anchor="middle" font-size="22" font-weight="700">Component · 디자인 조정</text>
    <text x="200" y="762" text-anchor="middle" font-size="20">노출 속성으로 외형·프리셋 수정</text>
  </g>
</svg>
